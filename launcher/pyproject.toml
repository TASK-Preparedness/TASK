# For development only. The supported install is the Debian package (packaging/build_deb.py).
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "task-launcher"
version = "0.3.8"
description = "T.A.S.K. application launcher (task-core client)"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.13"
# PySide6 comes from Debian (python3-pyside6.*); nothing is installed from PyPI on the Pi.
dependencies = []

[project.scripts]
task-launcher = "task_launcher.app:main"

[tool.setuptools.packages.find]
include = ["task_launcher*"]

[tool.setuptools.package-data]
task_launcher = ["data/apps.d/*.toml", "data/icons/lucide/*.svg", "data/icons/lucide/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "task-installer"
version = "0.2.0.dev0"
description = "T.A.S.K. Raspberry Pi installer (pre-alpha, dry run only)"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.8"]

[project.scripts]
task-installer = "task_installer.tui:main"

[tool.setuptools]
packages = ["task_installer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

REL_ID="phase4f3-medical-reader-0.3.7"
REL_TITLE="T.A.S.K. Phase 4F.3 Medical Reader Crash Repair (task-launcher 0.3.7 + task-resources 0.2.4)"
TARGETS=("task-launcher=0.3.7" "task-resources=0.2.4")
DEBS=("debs/task-launcher_0.3.7_all.deb" "debs/task-resources_0.2.4_all.deb")
REQUIRES=("task-launcher>=0.3.4" "task-resources>=0.2.1" "task-mesh>=0.3.1")
ROLLBACK=("task-launcher=0.3.6=rollback/task-launcher_0.3.6_all.deb"
          "task-launcher=0.3.5=rollback/task-launcher_0.3.5_all.deb"
          "task-launcher=0.3.4=rollback/task-launcher_0.3.4_all.deb"
          "task-resources=0.2.3=rollback/task-resources_0.2.3_all.deb"
          "task-resources=0.2.2=rollback/task-resources_0.2.2_all.deb"
          "task-resources=0.2.1=rollback/task-resources_0.2.1_all.deb")
SETTINGS=(".config/task-launcher" ".config/task-resources" ".local/state/task-launcher" ".local/state/task-resources")
SQLITE=(".local/share/task-resources/index.sqlite" ".local/share/task-resources/downloads.sqlite")
CLOSE_FIRST=("task_resources")
WARN_RUNNING=("task_launcher")
SOAPY_WARN=0
rel_extra_checks() {
    local rel db out
    for rel in "${SQLITE[@]}"; do
        db="$HOME/$rel"
        if [ ! -f "$db" ]; then tg_ok "~/$rel: not present (nothing to back up)"; continue; fi
        if [ -e "$db-wal" ] && [ ! -e "$db-shm" ]; then
            tg_warn "~/$rel has -wal without -shm (left by an earlier crash): kept as-is, never deleted"
        fi
        if out="$(/usr/bin/python3 -I "$HERE/tools/sqlite_backup.py" --check "$db" 2>&1)"; then
            tg_ok "~/$rel: consistent copy passes integrity_check ($out); source not modified"
        else
            tg_fail "~/$rel check failed: $out (nothing changed)"
        fi
    done
}

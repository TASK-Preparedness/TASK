[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "task-console"
version = "0.2.0"
description = "T.A.S.K. Console: desktop client of task-core (Phase 2)"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
# PySide6 comes from Debian trixie packages (python3-pyside6.qtcore, qtgui, qtwidgets, qtnetwork; qt6-wayland),
# installed by deploy/install-console.sh with apt. No pip dependencies (PHASE-2.md section 7.1).
dependencies = []

[project.scripts]
task-console = "task_console.app:main"

[tool.setuptools]
packages = ["task_console", "task_console.panels", "task_console.widgets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
qt_api = "pyside6"

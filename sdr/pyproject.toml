[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "task-sdr"
version = "0.2.2"
description = "T.A.S.K. SDR: receive-only SoapySDR receiver with audio, spectrum and waterfall"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.11"
dependencies = ["task-comms>=0.3.0", "numpy", "scipy", "PySide6"]

[project.scripts]
task-sdr = "task_sdr.app:main"

[tool.setuptools.packages.find]
include = ["task_sdr*"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "task-aprs"
version = "0.1.0"
description = "T.A.S.K. APRS: two-way amateur APRS via an existing Direwolf, plus a separate GMRS data profile"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.11"
dependencies = ["task-comms>=0.3.0", "PySide6"]

[project.scripts]
task-aprs = "task_aprs.app:main"

[tool.setuptools.packages.find]
include = ["task_aprs*"]

schema = 1
id = "usgs-topo"
name = "USGS Topo (The National Map)"
url = "https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}"
mechanism = "xyz"
format = "auto"
attribution = "Map services and data available from U.S. Geological Survey, National Geospatial Program. USGS The National Map: National Boundaries Dataset, 3DEP Elevation Program, Geographic Names Information System, National Hydrography Dataset, National Land Cover Database, National Structures Dataset, and National Transportation Dataset; U.S. Census Bureau TIGER/Line; Natural Earth"
license = "Public domain (U.S. Government work). Requested credit: \"Map services and data available from U.S. Geological Survey, National Geospatial Program.\""
usage_policy_url = "https://www.usgs.gov/faqs/what-are-terms-uselicensing-map-services-and-data-national-map"
offline_download_permitted = true
evidence = "USGS FAQ: 'Map services and data downloaded from The National Map are free and in the public domain. There are no restrictions.' The service metadata (USGSTopo/MapServer?f=pjson) declares exportTilesAllowed=true with maxExportTilesCount=100000, i.e. offline tile export is an intended use. No published request-rate limit was found; task-maps applies a conservative 2 requests/s with 2 connections and a 100000-tile cap per job (the service's own export cap)."
evidence_urls = ["https://www.usgs.gov/faqs/what-are-terms-uselicensing-map-services-and-data-national-map", "https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer?f=pjson"]

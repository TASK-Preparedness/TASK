rate_limit = 2.0
max_concurrency = 2
min_zoom = 0
max_zoom = 16
max_tiles_per_job = 100000
user_agent_required = false
api_key_required = false
enabled = true
coverage = "United States and territories in detail; world only at small scales"
avg_tile_bytes = 25000

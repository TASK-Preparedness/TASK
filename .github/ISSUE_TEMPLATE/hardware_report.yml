name: Hardware compatibility report
description: Tell us how T.A.S.K. works (or not) on your board, radio, GPS or SDR
labels: ["hardware", "compatibility"]
body:
  - type: input
    id: device
    attributes: {label: Device, placeholder: "Raspberry Pi 4 4GB / Heltec V3.2 / RTL-SDR Blog V4 / BTECH UV-PRO"}
    validations: {required: true}
  - type: input
    id: os
    attributes: {label: OS and architecture, placeholder: "Raspberry Pi OS 64-bit (trixie), arm64"}
    validations: {required: true}
  - type: input
    id: versions
    attributes: {label: T.A.S.K. versions}
    validations: {required: true}
  - type: dropdown
    id: result
    attributes:
      label: Result
      options: ["Works fully", "Works with problems", "Does not work", "Did not test (detection only)"]
    validations: {required: true}
  - type: textarea
    id: tested
    attributes: {label: What exactly did you test? What did you NOT test?}
    validations: {required: true}
  - type: textarea
    id: detect
    attributes:
      label: Installer detection output (optional)
      description: "cd installers/raspberry-pi && /usr/bin/python3 -m task_installer detect — remove anything private"
      render: text
  - type: checkboxes
    id: safety
    attributes:
      label: RF safety
      options:
        - label: I only transmitted where I am licensed to, or I did not transmit at all.
          required: true

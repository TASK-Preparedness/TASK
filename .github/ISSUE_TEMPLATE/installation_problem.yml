name: Installation problem
description: The installer, packages or offline bundle did not work
labels: ["installer", "triage", "experimental-alpha"]
body:
  - type: dropdown
    id: method
    attributes:
      label: Installation method
      options: [Installer GUI, Installer text mode (TUI), Offline bundle, Manual .deb install, From source]
    validations: {required: true}
  - type: input
    id: hardware
    attributes:
      label: Computer, OS and architecture
    validations: {required: true}
  - type: textarea
    id: versions
    attributes:
      label: Package versions (if any installed)
      description: "dpkg-query -W -f='${Package}\\t${Version}\\t${Architecture}\\n' 'task-*' python3-task-comms"
      render: text
  - type: textarea
    id: detect
    attributes:
      label: Output of `python3 -m task_installer detect` (optional, dry run only)
      render: text
  - type: textarea
    id: what
    attributes:
      label: What happened? Include the exact error.
    validations: {required: true}
  - type: dropdown
    id: network
    attributes:
      label: Network during install
      options: [Online, Fully offline, Unsure]
